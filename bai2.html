<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Form Đặt Mua Tài Liệu Lập Trình</h1>
    <form action="" method="POST">
        <label for="document">Chọn tài liệu:</label>
        <select id="document" name="document">
            <option value="htmlcss">Tài liệu môn HTML&CSS</option>
            <option value="javascript">Tài liệu môn Javascript</option>
        </select><br><br>

        <label for="quantity">Số lượng:</label>
        <input type="number" id="quantity" name="quantity" value="1" min="1"><br><br>

        <label for="notes">Ghi chú:</label><br>
        <textarea id="notes" name="notes" rows="4" cols="50"></textarea><br><br>

        <label for="address">Địa chỉ giao hàng:</label><br>
        <textarea id="address" name="address" rows="4" cols="50"></textarea><br><br>

        <input type="submit" value="Đặt mua">
    </form>
</body>
</html>
