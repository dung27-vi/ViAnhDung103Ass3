<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="post">
        <label for="fullname">Họ và tên:</label>
        <input type="text" id="fullname" name="fullname">
        <br><br>

        <label for="dob">Ngày sinh:</label>
        <input type="date" id="dob" name="dob"> mm/dd/yyyy
        <br><br>

        <label>Giới tính:</label>
        <input type="radio" id="male" name="gender" value="Nam">
        <label for="male">Nam</label>
        <input type="radio" id="female" name="gender" value="Nữ">
        <label for="female">Nữ</label>
        <br><br>

        <label for="phone">Số điện thoại:</label>
        <input type="text" id="phone" name="phone">
        <br><br>

        <label for="email">Email:</label>
        <input type="text" id="email" name="email">
        <br><br>

        <label for="companyname">Tên công ty:</label>
        <input type="text" id="companyname" name="companyname">
        <br><br>

        <label for="role">Vai trò trong công ty:</label>
        <select id="role" name="role">
            <option value="CEO">Giám đốc điều hành (CEO)</option>
        </select>
        <br><br>

        <label for="size">Quy mô công ty:</label>
        <select id="size" name="size">
            <option value="small">Doanh nghiệp nhỏ</option>
        </select>
        <br><br>

        <label for="industry">Ngành nghề công ty:</label>
        <input type="text" id="industry" name="industry">
        <br><br>

        <label for="reason">Lý do tham gia câu lạc bộ:</label>
        <textarea id="reason" name="reason" rows="4" cols="50"></textarea>
        <br><br>

        <label for="experience">Kinh nghiệm lãnh đạo:</label>
        <textarea id="experience" name="experience" rows="4" cols="50"></textarea>
        <br><br>

        <label for="goal">Mục tiêu khi tham gia câu lạc bộ:</label>
        <textarea id="goal" name="goal" rows="4" cols="50"></textarea>
        <br><br>

        <label>Chương trình sự kiện mong muốn tham gia:</label>
        <input type="checkbox" id="networking" name="events" value="Networking">
        <label for="networking">Networking</label>
        <input type="checkbox" id="workshops" name="events" value="Workshops">
        <label for="workshops">Workshops</label>
        <input type="checkbox" id="seminar" name="events" value="Hội thảo">
        <label for="seminar">Hội thảo</label>
        <br><br>

        <label>Đăng ký nhận bản tin:</label>
        <input type="checkbox" id="newsletter" name="newsletter" value="Có">
        <label for="newsletter">Có</label>
        <br><br>

        <input type="submit" value="Đăng ký hội viên">
    </form>
</body>
</html>
